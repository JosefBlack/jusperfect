AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  jusperfect – kontrollierte KI-Schicht über jur|nodes.
  Cognito (MFA) -> API Gateway (JWT) -> Lambda (FastAPI) -> Bedrock Converse mit Guardrail.
  DynamoDB und S3 als Sitzungsspeicher mit Ablauf, Textract für Scans, Secrets Manager für
  das jur|nodes-Token, KMS-Schlüssel, Budget-Alarme. Region: eu-central-1.

Parameters:
  Stufe:
    Type: String
    Default: pilot
    AllowedPattern: "^[a-z0-9-]{2,20}$"
  GedaechtnisUebergangsfristTage:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 3650
    Description: >-
      Uebergangsfrist nach bestaetigtem Abschluss der Akte in jurnodes, bevor der
      Arbeitsbereich geloescht werden kann. Eine Bearbeitungspause loest niemals
      eine Loeschung aus; die Frist beginnt allein mit dem Abschlussereignis.
  ModellId:
    Type: String
    Default: anthropic.claude-opus-5
    Description: Bedrock-Modellkennung oder EU-Inferenzprofil (Phase 0 prüfen).
  ModellIdKlein:
    Type: String
    Default: ""
    Description: Optionales kleineres Modell für die Eingangsprüfung.
  GuardrailId:
    Type: String
    Default: ""
    Description: Bedrock-Guardrail (leer = ohne Guardrail, nur für die Entwicklung).
  GuardrailVersion:
    Type: String
    Default: DRAFT
  JurNodesUrl:
    Type: String
    Default: ""
    Description: Basis-URL der jur|nodes-API (https). Leer = Testakten im Paket (nur Entwicklung).
  MonatsbudgetEur:
    Type: Number
    Default: 125
  BudgetUsd:
    Type: Number
    Default: 140
    Description: AWS-Budget in USD (AWS Budgets rechnet in USD); Alarme bei 50, 80, 100 Prozent.
  AlarmEmail:
    Type: String
    Description: Empfänger der Budget- und Fehleralarme.
  OberflaecheUrl:
    Type: String
    Default: "http://localhost:8765"
    Description: Adresse der Oberfläche (Callback für Cognito); nach dem ersten Deploy auf die CloudFront-URL setzen.
Conditions:
  MitJurNodes: !Not [!Equals [!Ref JurNodesUrl, ""]]
  MitGuardrail: !Not [!Equals [!Ref GuardrailId, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 300
    MemorySize: 1024

Resources:
  # ── Schlüssel und Geheimnisse ────────────────────────────────────────────
  Schluessel:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "jusperfect ${Stufe} – Sitzungsdaten und Geheimnisse"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Kontoverwaltung
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: DiensteImKonto
            Effect: Allow
            Principal: { Service: [logs.amazonaws.com, s3.amazonaws.com, dynamodb.amazonaws.com] }
            Action: ["kms:Encrypt", "kms:Decrypt", "kms:GenerateDataKey*", "kms:DescribeKey"]
            Resource: "*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  SchluesselAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/jusperfect-${Stufe}"
      TargetKeyId: !Ref Schluessel

  JurNodesGeheimnis:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "jusperfect/${Stufe}/jurnodes"
      Description: jur|nodes-API-Token. Wert nach dem Deploy in der Konsole oder per CLI setzen.
      KmsKeyId: !Ref Schluessel
      SecretString: '{"token": "BITTE-SETZEN"}'

  # ── Sitzungsspeicher ─────────────────────────────────────────────────────
  Tabelle:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "jusperfect-${Stufe}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ablauf, Enabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref Schluessel }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: false }
      DeletionProtectionEnabled: false

  SitzungsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "jusperfect-${Stufe}-sitzungen-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref Schluessel }
            BucketKeyEnabled: true
      VersioningConfiguration: { Status: Suspended }
      LifecycleConfiguration:
        Rules:
          - Id: TemporaereTexteLoeschen
            Status: Enabled
            # Sieben Tage fortsetzbare Arbeit plus technische Karenz.
            ExpirationInDays: 8
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  SitzungsBucketRichtlinie:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SitzungsBucket
      PolicyDocument:
        Statement:
          - Sid: NurVerschluesselt
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SitzungsBucket.Arn, !Sub "${SitzungsBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # Anders als der Sitzungsbucket hat dieser Bucket bewusst keinen kurzen
  # Lebenszyklus: Er ist die dauerhafte, eigene Fallgedächtnis-Ablage der Kanzlei.
  GedaechtnisBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "jusperfect-${Stufe}-gedaechtnis-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref Schluessel }
            BucketKeyEnabled: true
      VersioningConfiguration: { Status: Suspended }
      # Keine zeitabhängige Objekt-Lifecycle-Löschung: Lange gerichtliche
      # Bearbeitungspausen sind kein Abschluss. Der kontrollierte Löschworkflow
      # wird ausschließlich durch den Aktenstatus in jurnodes ausgelöst.
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  GedaechtnisBucketRichtlinie:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref GedaechtnisBucket
      PolicyDocument:
        Statement:
          - Sid: NurTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt GedaechtnisBucket.Arn, !Sub "${GedaechtnisBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: NurKmsVerschluesselteObjekte
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${GedaechtnisBucket.Arn}/*"
            Condition:
              StringNotEquals: { "s3:x-amz-server-side-encryption": "aws:kms" }

  # ── Anmeldung ────────────────────────────────────────────────────────────
  Nutzerpool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "jusperfect-${Stufe}"
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      UserPoolAddOns: { AdvancedSecurityMode: ENFORCED }

  NutzerpoolDomaene:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Nutzerpool
      Domain: !Sub "jusperfect-${Stufe}-${AWS::AccountId}"

  NutzerpoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Nutzerpool
      ClientName: oberflaeche
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: [!Ref OberflaecheUrl]
      LogoutURLs: [!Ref OberflaecheUrl]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 1
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  GruppeAlleAkten:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref Nutzerpool
      GroupName: alle-akten
      Description: Anwälte – Zugriff auf alle Akten

  # ── API und Funktion ─────────────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stufe
      CorsConfiguration:
        AllowOrigins: [!Ref OberflaecheUrl]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${Nutzerpool}"
              audience: [!Ref NutzerpoolClient]
            IdentitySource: "$request.header.Authorization"
      AccessLogSettings:
        DestinationArn: !GetAtt ApiProtokoll.Arn
        # Kein Anfragetext, keine Kopfzeilen – nur Weg, Status, Dauer.
        Format: '{"zeit":"$context.requestTime","weg":"$context.routeKey","status":"$context.status","dauer":"$context.responseLatency","id":"$context.requestId"}'

  ApiProtokoll:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/jusperfect/${Stufe}/api"
      RetentionInDays: 30
      KmsKeyId: !GetAtt Schluessel.Arn

  FunktionProtokoll:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/jusperfect-${Stufe}"
      RetentionInDays: 30
      KmsKeyId: !GetAtt Schluessel.Arn

  Funktion:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "jusperfect-${Stufe}"
      CodeUri: ../
      Handler: jusperfect.lambda_handler.handler
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          JUSPERFECT_BETRIEBSART: aws
          JUSPERFECT_ANBIETER: bedrock
          JUSPERFECT_AWS_REGION: !Ref AWS::Region
          JUSPERFECT_MODELL_ID: !Ref ModellId
          JUSPERFECT_MODELL_ID_KLEIN: !Ref ModellIdKlein
          JUSPERFECT_GUARDRAIL_ID: !Ref GuardrailId
          JUSPERFECT_GUARDRAIL_VERSION: !Ref GuardrailVersion
          JUSPERFECT_IDENTITAET: cognito
          JUSPERFECT_SPEICHER: aws
          JUSPERFECT_DYNAMODB_TABELLE: !Ref Tabelle
          JUSPERFECT_S3_BUCKET: !Ref SitzungsBucket
          JUSPERFECT_KMS_SCHLUESSEL_ID: !Ref Schluessel
          # Erst nach Anpassung von DSFA, Verarbeitungsverzeichnis, Hinweisen
          # und Mandatsbedingungen von "aus" auf "aws" setzen.
          JUSPERFECT_GEDAECHTNIS: aus
          JUSPERFECT_GEDAECHTNIS_BUCKET: !Ref GedaechtnisBucket
          # Uebergangsfrist nach *bestaetigtem* Abschluss der Akte in jurnodes.
          # Sie beginnt nur mit diesem Ereignis, nie durch Nichtbenutzung.
          JUSPERFECT_GEDAECHTNIS_UEBERGANGSFRIST_TAGE: !Ref GedaechtnisUebergangsfristTage
          JUSPERFECT_DIALOG_MAX_RUNDEN: "6"
          JUSPERFECT_OCR: textract
          JUSPERFECT_JURNODES_ADAPTER: !If [MitJurNodes, http, fixture]
          JUSPERFECT_JURNODES_URL: !Ref JurNodesUrl
          JUSPERFECT_JURNODES_SECRET_ARN: !If [MitJurNodes, !Ref JurNodesGeheimnis, ""]
          JUSPERFECT_FIXTURE_PFAD: testdaten/akten
          JUSPERFECT_MONATSBUDGET_EUR: !Ref MonatsbudgetEur
          JUSPERFECT_SITZUNG_TTL_SEKUNDEN: "604800"
      Events:
        Alles:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/{proxy+}
            Method: ANY
      Policies:
        - Version: "2012-10-17"
          Statement:
            # Nur Claude. Zuvor stand hier "foundation-model/*", also jedes
            # Modell, das Bedrock anbietet. Ein Tippfehler in der Modellkennung
            # oder eine spaetere Aenderung haette Aktentext an ein Modell
            # schicken koennen, das nie geprueft wurde. Der Deny unten macht
            # die Beschraenkung verbindlich: Er wiegt staerker als jedes
            # Allow, auch aus einer anderen Richtlinie.
            - Sid: NurClaude
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/eu.anthropic.claude-*"
            - Sid: KeinAnderesModell
              Effect: Deny
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              NotResource:
                - !Sub "arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/eu.anthropic.claude-*"
            - !If
              - MitGuardrail
              - Sid: Guardrail
                Effect: Allow
                Action: [bedrock:ApplyGuardrail]
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}"
              - !Ref AWS::NoValue
            - Sid: Kanzleiwissen
              Effect: Allow
              Action: [bedrock:Retrieve]
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            - Sid: Textract
              Effect: Allow
              Action: [textract:DetectDocumentText, textract:StartDocumentTextDetection, textract:GetDocumentTextDetection]
              Resource: "*"
            - Sid: Sitzungsbucket
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket]
              Resource: [!GetAtt SitzungsBucket.Arn, !Sub "${SitzungsBucket.Arn}/*"]
            - Sid: Gedaechtnisbucket
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub "${GedaechtnisBucket.Arn}/*"
            - Sid: Tabelle
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt Tabelle.Arn
            - Sid: Geheimnis
              Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref JurNodesGeheimnis
            - Sid: Schluessel
              Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt Schluessel.Arn
            - Sid: NurEuRegionen
              Effect: Deny
              Action: ["bedrock:*", "textract:*", "s3:*", "dynamodb:*"]
              Resource: "*"
              Condition:
                StringNotLike: { "aws:RequestedRegion": "eu-*" }

  # ── Oberfläche: S3 hinter CloudFront ─────────────────────────────────────
  OberflaecheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "jusperfect-${Stufe}-oberflaeche-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OberflaecheZugang:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "jusperfect-${Stufe}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  OberflaecheVerteilung:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "jusperfect ${Stufe}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: oberflaeche
            DomainName: !GetAtt OberflaecheBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OberflaecheZugang.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: oberflaeche
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized (AWS-verwaltet)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03   # SecurityHeadersPolicy (AWS-verwaltet)
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  OberflaecheBucketRichtlinie:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OberflaecheBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${OberflaecheBucket.Arn}/*"
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${OberflaecheVerteilung}" }

  # ── Alarme ───────────────────────────────────────────────────────────────
  Alarmthema:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "jusperfect-${Stufe}-alarme"
      KmsMasterKeyId: alias/aws/sns

  AlarmAbonnement:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Alarmthema
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "jusperfect-${Stufe}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]

  FehlerAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "jusperfect-${Stufe}-fehler"
      AlarmDescription: Mehr als fünf Fehler jusperfect-Funktion in fünf Minuten.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Funktion }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alarmthema]

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stufe}"
  OberflaecheUrl:
    Value: !Sub "https://${OberflaecheVerteilung.DomainName}"
  OberflaecheBucket:
    Value: !Ref OberflaecheBucket
  CognitoDomaene:
    Value: !Sub "https://${NutzerpoolDomaene}.auth.${AWS::Region}.amazoncognito.com"
  CognitoClientId:
    Value: !Ref NutzerpoolClient
  NutzerpoolId:
    Value: !Ref Nutzerpool
  Tabelle:
    Value: !Ref Tabelle
  GedaechtnisBucket:
    Value: !Ref GedaechtnisBucket
  JurNodesGeheimnis:
    Value: !Ref JurNodesGeheimnis
